name: Course agent

on:
  schedule:
    # Weekdays at 12:47 UTC = 8:47am New York time during daylight saving (7:47am in winter).
    # GitHub cron is always UTC; adjust to your time zone.
    - cron: "47 12 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print messages instead of sending them"
        type: boolean
        default: true

concurrency: course-agent

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python -m course_agent run ${{ inputs.dry_run && '--dry-run' || '' }}
