<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nemotron chat</title>
<style>
  :root {
    --page: #ffffff; --soft: #f4f4f2; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --hair: #e1e0d9;
    --border: rgba(11,11,11,.14); --accent: #2a78d6; --bad-wash: #fbeaea; --bad-ink: #a82a2a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  button, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .45; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .rehearsal { background: var(--soft); color: var(--ink2); font-size: 14px; text-align: center; padding: 4px 16px; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--hair); }
  header h1 { font-size: 18px; margin: 0; }
  header span { color: var(--ink2); font-size: 16px; }
  .grow { flex: 1; }
  .btn { border: 1px solid var(--border); background: var(--page); border-radius: 9px; padding: 6px 14px; font-size: 16px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .link { border: 0; background: none; padding: 0; color: var(--accent); font-size: 15px; text-decoration: underline; }

  main { flex: 1; overflow-y: auto; }
  .col { max-width: 780px; margin: 0 auto; padding: 24px 20px; }
  .try { color: var(--muted); font-size: 15px; margin: 26px 0 8px; }
  .starters { display: grid; gap: 10px; text-align: left; }
  .starters button { border: 1px solid var(--border); background: var(--page); border-radius: 12px; padding: 12px 16px; text-align: left; }
  .starters button:hover { background: var(--soft); }
  .msg { margin: 0 0 18px; }
  .you { display: flex; justify-content: flex-end; }
  .you div { max-width: 85%; background: var(--soft); border-radius: 18px; padding: 10px 16px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .who { font-size: 14px; color: var(--muted); margin: 0 0 2px; }
  .reply { overflow-wrap: anywhere; white-space: pre-wrap; }
  .reply dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 0; white-space: normal; }
  .reply dt { color: var(--ink2); }
  .reply dd { margin: 0; font-weight: 600; }
  .typing::after { content: "▍"; color: var(--muted); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .typing::after { animation: none; } }
  .note { text-align: center; color: var(--muted); font-size: 15px; margin: 0 0 18px; }

  footer { border-top: 1px solid var(--hair); }
  footer .col { padding: 10px 20px 16px; }
  .error { background: var(--bad-wash); color: var(--bad-ink); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; font-size: 16px; }
  .again { margin-bottom: 8px; }
  form.ask { display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; resize: none; min-height: 50px; max-height: 160px; padding: 11px 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--page); }
  form.ask .btn { height: 50px; padding: 0 20px; font-size: 18px; }
</style>
</head>
<body>
<div class="rehearsal" id="rehearsal" hidden>Rehearsal: no model is loaded, the answers are simulated.</div>
<header>
  <h1>Nemotron</h1>
  <span id="company"></span>
  <span class="grow"></span>
  <span id="serving"></span>
</header>
<main id="main"><div class="col" id="thread"></div></main>
<footer><div class="col">
  <div class="error" id="error" role="alert" hidden></div>
  <div class="again" id="again-row" hidden><button class="link" id="again">Ask the same questions again</button></div>
  <form class="ask" id="ask">
    <textarea id="text" rows="1" placeholder="Message Nemotron" aria-label="Message"></textarea>
    <button class="btn primary" id="send">Send</button>
  </form>
</div></footer>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S = null, lastVersion = -1, timer = null;

async function api(name, body) {
  const r = await fetch("api/" + name, {method: body ? "POST" : "GET", headers: {"Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "Request failed.");
  return data;
}
async function act(name, body) {
  try { showError(""); apply(await api(name, body || {})); }
  catch (e) { showError(e.message); }
  schedule(200);
}
function showError(msg) { const el = $("#error"); el.hidden = !msg; el.textContent = msg; }
function schedule(ms) { clearTimeout(timer); timer = setTimeout(poll, ms); }
async function poll() {
  try { apply(await api("state")); } catch (e) { /* the notebook may be restarting; keep trying */ }
  schedule(S && S.busy === "answering" ? 400 : 1500);
}

const modelName = (model) => model === "fine-tuned" ? "Fine-tuned model" : "Original model";

function turnHtml(t) {
  let reply;
  if (t.status === "waiting") reply = `<div class="reply typing"></div>`;
  else if (t.status === "running") reply = `<div class="reply typing">${esc(t.reply)}</div>`;
  else if (t.status === "failed") reply = `<div class="reply">(no answer)</div>`;
  else if (t.fields) reply = `<div class="reply"><dl>${t.fields.map((f) => `<dt>${esc(f.name)}</dt><dd>${esc(f.value || "—")}</dd>`).join("")}</dl></div>`;
  else reply = `<div class="reply">${esc(t.reply)}</div>`;
  return `<div class="msg you"><div>${esc(t.text)}</div></div><div class="msg"><p class="who">${modelName(t.model)}</p>${reply}</div>`;
}

function renderThread() {
  const box = $("#thread"), main = $("#main");
  const nearBottom = main.scrollHeight - main.scrollTop - main.clientHeight < 160;
  const fresh = !S.thread.some((x) => x.kind === "turn");
  const slot = (id, html, first) => {
    let el = document.getElementById(id);
    if (!el) { el = document.createElement("div"); el.id = id; first ? box.prepend(el) : box.appendChild(el); }
    if (el._html !== html) { el.innerHTML = html; el._html = html; }
    return el;
  };
  slot("opening", `<div class="msg you"><div>${esc(S.opening)}</div></div>`, true);
  const seen = new Set(["opening", "starters", "training"]);
  for (const item of S.thread) {
    const id = "it-" + item.id; seen.add(id);
    const html = item.kind === "turn" ? turnHtml(item)
      : item.kind === "hello" ? `<div class="msg"><p class="who">${modelName("original")}</p><div class="reply ${item.status === "running" ? "typing" : ""}">${esc(item.reply)}</div></div>`
      : `<p class="note">${esc(item.text)}</p>`;
    let el = document.getElementById(id);
    if (!el) { el = document.createElement("div"); el.id = id; box.appendChild(el); }
    if (el._html !== html) { el.innerHTML = html; el._html = html; }
  }
  const starters = slot("starters", !fresh || S.busy ? "" : `<p class="try">Try one of these, or type your own:</p><div class="starters">${S.starters.map((s, i) => `<button data-i="${i}">${esc(s)}</button>`).join("")}</div>`);
  box.appendChild(starters);
  starters.querySelectorAll("button").forEach((b) => { b.onclick = () => act("ask", {text: S.starters[+b.dataset.i]}); });
  box.appendChild(slot("training", S.busy === "fine-tuning" ? `<p class="note">The model is being fine-tuned in the notebook.</p>` : ""));
  [...box.children].forEach((el) => { if (!seen.has(el.id)) el.remove(); });
  if (nearBottom && !fresh) main.scrollTop = main.scrollHeight;  // a fresh chat starts at the top
}

function apply(state) {
  S = state;
  if (S.version === lastVersion) return;
  lastVersion = S.version;
  $("#rehearsal").hidden = !S.simulated;
  $("#company").textContent = S.company;
  $("#serving").textContent = modelName(S.serving);
  $("#send").disabled = !!S.busy;
  const turns = S.thread.filter((x) => x.kind === "turn"), done = new Set(turns.filter((x) => x.model === S.serving).map((x) => x.text));
  $("#again-row").hidden = !!S.busy || !turns.some((x) => !done.has(x.text));
  if (S.error) showError(S.error);
  renderThread();
}

$("#ask").onsubmit = (ev) => { ev.preventDefault(); const t = $("#text"), text = t.value.trim(); if (!text || (S && S.busy)) return; t.value = ""; t.style.height = ""; act("ask", {text}); };
$("#text").onkeydown = (ev) => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("#ask").requestSubmit(); } };
$("#text").oninput = (ev) => { ev.target.style.height = ""; ev.target.style.height = Math.min(160, ev.target.scrollHeight) + "px"; };
$("#again").onclick = () => act("again");
poll();
</script>
</body>
</html>
